<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site_title }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site_tagline }}{% endblock %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ root }}assets/style.css">
</head>
<body>
<header class="site-header">
  <a class="site-name" href="{{ root }}index.html">{{ site_title }}</a>
  <nav aria-label="主要導覽">
    <a href="{{ root }}index.html#path">學習路線</a>
    <a href="{{ root }}index.html#wanted">待寫清單</a>
    <a href="{{ root }}log.html">更新紀錄</a>
  </nav>
</header>
{% block body %}{% endblock %}
<footer class="site-footer">
  <p>本站僅供學習時間序列分析之用，所有圖表皆為固定種子的模擬資料，不構成任何投資建議。</p>
  <p>© {{ year }} {{ site_title }}。頁面由 AI 依專案中的 AGENTS.md 規則整理。</p>
</footer>
<script src="{{ root }}assets/lab.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
